<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>我的每日課表</title>
<style>
:root {
  --bg:#f7f8fb; --card:#ffffff; --ink:#14202b; --muted:#6b7280;
  --line:#e5e7eb; --accent:#1f6f5f; --accent-soft:#e7f4ef;
  --empty:#f3f4f6; --special:#fff3e8; --now:#fff5c2;
}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:780px;margin:auto;padding:20px 16px 48px}
.hero{background:linear-gradient(135deg,#17343d,#244f58);color:white;border-radius:24px;padding:22px;box-shadow:0 12px 30px rgba(20,32,43,.12)}
.topline{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.kicker{font-size:13px;opacity:.75;margin-bottom:6px}
h1{font-size:28px;margin:0 0 6px}
.date{font-size:16px;opacity:.92}
.badge{background:rgba(255,255,255,.14);padding:9px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin:16px 0}
button,input[type=date]{border:1px solid var(--line);background:white;border-radius:14px;padding:11px 13px;font:inherit;color:var(--ink)}
button{cursor:pointer;font-weight:650}
button:hover{background:#f1f5f9}
.today-btn{background:var(--accent);color:white;border-color:var(--accent)}
.today-btn:hover{background:#195c4f}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.section-title h2{font-size:18px;margin:0}
.summary{font-size:13px;color:var(--muted)}
.timeline{display:grid;gap:10px}
.row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:stretch}
.time{padding:14px 8px;text-align:center;color:var(--muted);font-size:12px;line-height:1.45;border-radius:16px;background:white;border:1px solid var(--line)}
.time strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.card{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:68px;display:flex;flex-direction:column;justify-content:center}
.card.course{background:var(--accent-soft);border-color:#cfe8de}
.card.empty{background:var(--empty);color:#8a9098}
.card.special{background:var(--special);border-color:#f4d8bd}
.card.now{outline:3px solid #f1c94a;background:var(--now)}
.course-name{font-weight:750;font-size:16px;white-space:pre-line}
.note{font-size:12px;color:var(--muted);margin-top:4px;white-space:pre-line}
.lunch{margin:10px 0;padding:12px 14px;border-radius:14px;background:#fff8dd;border:1px solid #f0e2a4;text-align:center;color:#776528;font-size:13px}
.empty-day{padding:34px 18px;text-align:center;border:1px dashed #cbd5e1;border-radius:20px;background:white;color:var(--muted)}
.footer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
@media (max-width:560px){
 .app{padding:12px 10px 32px} .hero{border-radius:20px;padding:18px}
 h1{font-size:24px} .row{grid-template-columns:78px 1fr} .controls{grid-template-columns:1fr 1fr}
 .controls input{grid-column:1/3;order:-1} .badge{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="topline">
      <div>
        <div class="kicker">自動偵測日期 · 每日課表</div>
        <h1 id="heroTitle">今天的課表</h1>
        <div class="date" id="dateText"></div>
      </div>
      <div class="badge" id="statusBadge">讀取中</div>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn">← 前一天</button>
    <input id="datePicker" type="date">
    <button id="nextBtn">後一天 →</button>
  </div>
  <button class="today-btn" id="todayBtn" style="width:100%">回到今天</button>

  <div class="section-title">
    <h2 id="sectionTitle">課程</h2>
    <div class="summary" id="summary"></div>
  </div>

  <div id="schedule"></div>

  <div class="footer">
    課表資料範圍：2026-09-07 ～ 2027-01-15<br>
    網頁會依裝置的本地日期自動顯示當天課表。
  </div>
</div>

const META = {"termStart": "2026-09-07", "termEnd": "2027-01-15", "periodTimes": {"1": "08:20–09:10", "2": "09:15–10:05", "3": "10:10–11:00", "4": "11:10–12:00", "5": "13:15–14:05", "6": "14:10–15:00", "7": "15:05–15:55", "8": "16:00–16:50"}, "lunch": "12:00–13:10", "title": "我的每日課表"};

const specialWords = ["全校","活動","測驗","考","參訪","校外","講座","工作坊","書院","健檢","發表","交流","社團"];
const weekdays = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

function localISO(d=new Date()) {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseISO(s) {
  const [y,m,d]=s.split("-").map(Number);
  return new Date(y,m-1,d);
}
function formatDate(s) {
  const d=parseISO(s);
  return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · ${weekdays[d.getDay()]}`;
}
function addDays(s,n) {
  const d=parseISO(s); d.setDate(d.getDate()+n); return localISO(d);
}
function currentPeriod(dateStr) {
  if (dateStr !== localISO()) return null;
  const now = new Date();
  const mins = now.getHours()*60 + now.getMinutes();
  const ranges = {
    1:[8*60+20,9*60+10],2:[9*60+15,10*60+5],3:[10*60+10,11*60],4:[11*60+10,12*60],
    5:[13*60+15,14*60+5],6:[14*60+10,15*60],7:[15*60+5,15*60+55],8:[16*60,16*60+50]
  };
  for (const [p,[a,b]] of Object.entries(ranges)) if (mins>=a && mins<=b) return p;
  return null;
}

let selected = localISO();

function splitValue(v) {
  if (!v || v === "空堂") return {name:"空堂", note:""};
  const parts = v.split("\n");
  return {name:parts[0], note:parts.slice(1).join("\n")};
}

function render() {
  document.getElementById("datePicker").value = selected;
  document.getElementById("dateText").textContent = formatDate(selected);

  const isToday = selected === localISO();
  document.getElementById("heroTitle").textContent = isToday ? "今天的課表" : "這一天的課表";

  const d = parseISO(selected);
  const weekend = d.getDay()===0 || d.getDay()===6;
  const dayData = DATA[selected];

  const badge = document.getElementById("statusBadge");
  if (isToday) badge.textContent = "今天";
  else if (selected < META.termStart || selected > META.termEnd) badge.textContent = "學期外";
  else if (weekend) badge.textContent = "週末";
  else badge.textContent = "指定日期";

  const root = document.getElementById("schedule");
  root.innerHTML = "";

  if (!dayData) {
    root.innerHTML = `<div class="empty-day">${weekend ? "今天是週末，沒有排定課程。" : "這一天沒有課表資料。"}</div>`;
    document.getElementById("summary").textContent = "0 堂";
    return;
  }

  let count = 0;
  const nowP = currentPeriod(selected);

  for (let p=1; p<=8; p++) {
    if (p===5) {
      const lunch = document.createElement("div");
      lunch.className = "lunch";
      lunch.textContent = `午休 · ${META.lunch}`;
      root.appendChild(lunch);
    }

    const raw = dayData[String(p)] || "空堂";
    const {name,note} = splitValue(raw);
    if (name !== "空堂") count++;

    const row = document.createElement("div");
    row.className = "row";

    const time = document.createElement("div");
    time.className = "time";
    time.innerHTML = `<strong>第 ${p} 節</strong>${META.periodTimes[p]}`;

    const card = document.createElement("div");
    let cls = name==="空堂" ? "empty" : (specialWords.some(w => raw.includes(w)) ? "special" : "course");
    card.className = "card " + cls + (String(p)===String(nowP) ? " now" : "");
    card.innerHTML = `<div class="course-name">${name}</div>${note ? `<div class="note">${note}</div>` : ""}`;

    row.append(time,card);
    root.appendChild(row);
  }

  document.getElementById("summary").textContent = `${count} 堂課／活動`;
}

document.getElementById("prevBtn").onclick = () => { selected=addDays(selected,-1); render(); };
document.getElementById("nextBtn").onclick = () => { selected=addDays(selected,1); render(); };
document.getElementById("todayBtn").onclick = () => { selected=localISO(); render(); };
document.getElementById("datePicker").onchange = e => { if(e.target.value){selected=e.target.value;render();} };

render();
setInterval(render, 60000);
